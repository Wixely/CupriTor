name: Sample bundles

# Builds each sample app into standalone, self-contained single-file zips for Windows and Ubuntu,
# uploads them as artifacts, and attaches them to the GitHub release on a v* tag.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # attach bundles to the release
  packages: read    # restore the CupriCurve package from GitHub Packages

jobs:
  bundle:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            label: windows
          - os: ubuntu-latest
            rid: linux-x64
            label: ubuntu
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Authenticate GitHub Packages (for CupriCurve)
        run: >
          dotnet nuget update source github-wixely
          --username "${{ github.actor }}"
          --password "${{ secrets.GITHUB_TOKEN }}"
          --store-password-in-clear-text
          --configfile nuget.config

      - name: Publish samples (self-contained, single-file)
        shell: bash
        run: |
          set -e
          for name in OnionWebApp TorHttpClient TorSocks5Proxy; do
            echo "== publishing $name (${{ matrix.rid }}) =="
            dotnet publish "samples/$name/$name.csproj" -c Release -r ${{ matrix.rid }} \
              --self-contained true \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:DebugType=None -p:DebugSymbols=false \
              -o "out/$name"
            cp "samples/$name/README.md" "out/$name/" 2>/dev/null || true
            cp LICENSE THIRD-PARTY-NOTICES.md "out/$name/" 2>/dev/null || true
          done

      - name: Zip per sample
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Get-ChildItem out -Directory | ForEach-Object {
            $zip = "dist/$($_.Name)-${{ matrix.label }}.zip"
            Compress-Archive -Path "$($_.FullName)/*" -DestinationPath $zip -Force
            Write-Host "packed $zip"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: samples-${{ matrix.label }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
